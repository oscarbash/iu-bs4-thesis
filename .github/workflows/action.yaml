name: Build LaTeX Document

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/cache@v5
        name: Tectonic cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-
      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17
          biber-version: 2.17
      - name: Run Tectonic
        run: tectonic thesis.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis.pdf
      - name: Prepare Pages artifact
        run: |
          mkdir --parents public/
          mv thesis.pdf public/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
